name: Automated Clean-up & Cross-Platform Rust Build

on:
  push:
    tags:
      - "release-trigger" # ทำงานเมื่อได้รับสัญญาณ Tag จากสคริปต์คอมพิวเตอร์ของคุณ

jobs:
  cleanup-and-build:
    name: Clean Files and Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: my_program_linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: my_program_windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: my_program_mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. ติดตั้ง Rust Environment สำหรับ Platform นั้นๆ
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 2. สั่ง Build Rust (ระบุพาธไปยัง rust_logic/Cargo.toml)
      - name: Build Rust Project
        run: cargo build --release --target ${{ matrix.target }} --manifest-path ./rust_logic/Cargo.toml

      # 3. ย้ายตัวแปรที่ Build เสร็จแล้วจากในโฟลเดอร์ rust_logic จัดลงโฟลเดอร์ bin
      - name: Organize into bin folder
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp rust_logic/target/${{ matrix.target }}/release/*.exe bin/
          else
            # ป้องกันไม่ให้ก๊อปปี้ไฟล์เบื้องหลังจำพวก .d หรือโฟลเดอร์ย่อย
            find rust_logic/target/${{ matrix.target }}/release/ -maxdepth 1 -type f ! -name "*.d" -exec cp {} bin/ \;
          fi

      # 4. ทำการ Clean-up ลบไฟล์/โฟลเดอร์ที่ไม่ต้องการออก (ย้ายมาทำตรงนี้เพื่อไม่ให้กระทบตอน Build)
      - name: Clean up unused folders and internal READMEs
        shell: bash
        run: |
          echo "🧹 กำลังลบโฟลเดอร์ที่ไม่จำเป็น..."
          rm -rf .claude
          rm -rf rust_logic
          rm -rf build_all.py
          rm -rf docs

          echo "📝 กำลังลบ README.md ทุกที่ ยกเว้นที่ Root โฟลเดอร์..."
          find . -mindepth 2 -name "README.md" -exec rm -f {} \;

      # 5. อัปโหลดไฟล์ผลลัพธ์ในโฟลเดอร์ bin เก็บไว้บนเว็บ
      - name: Upload Binary Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/
