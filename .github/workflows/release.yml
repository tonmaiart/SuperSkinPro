name: Automated Clean-up & Cross-Platform Rust Build

on:
  push:
    tags:
      - "release-trigger" # ทำงานเมื่อได้รับสัญญาณ Tag จากสคริปต์คอมพิวเตอร์ของคุณ

jobs:
  cleanup-and-build:
    name: Clean Files and Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: my_program_linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: my_program_windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: my_program_mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. ทำการ Clean-up ลบไฟล์ตามเงื่อนไขที่คุณต้องการ
      - name: Clean up unused folders and internal READMEs
        shell: bash
        run: |
          echo "🧹 กำลังลบโฟลเดอร์ที่ไม่จำเป็น..."
          rm -rf .claude
          rm -rf rust_logic
          rm -rf build_all.py
          rm -rf docs

          echo "📝 กำลังลบ README.md ทุกที่ ยกเว้นที่ Root โฟลเดอร์..."
          # หา README.md ทั้งหมดที่ไม่ใช่ตัวแรกที่ root แล้วสั่งลบ
          find . -mindepth 2 -name "README.md" -exec rm -f {} \;

      # 2. ติดตั้ง Rust Environment สำหรับ Platform นั้นๆ
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 3. สั่ง Build Rust (ระบุพาธไปยัง Cargo.toml ให้ถูกต้อง)
      - name: Build Rust Project
        run: cargo build --release --target ${{ matrix.target }} --manifest-path ./ชื่อโฟลเดอร์ย่อยของคุณ/Cargo.toml

      # 4. ย้ายตัวแปรที่ Build เสร็จแล้วจัดลงโฟลเดอร์ bin
      - name: Organize into bin folder
        shell: bash
        run: |
          mkdir -p bin
          # ปรับพาธให้วิ่งเข้าไปในโฟลเดอร์ย่อยนั้นด้วย
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp ชื่อโฟลเดอร์ย่อยของคุณ/target/${{ matrix.target }}/release/*.exe bin/
          else
            cp ชื่อโฟลเดอร์ย่อยของคุณ/target/${{ matrix.target }}/release/* bin/
          fi
      # 5. อัปโหลดไฟล์ผลลัพธ์ (Artifacts) เก็บไว้บนเว็บ เพื่อให้คุณดาวน์โหลดไปใช้งานต่อได้ทันที
      - name: Upload Binary Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/
